name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Environment Secrets
        run: |
          if [ -n "$IMGBB_API_KEY" ]; then
            echo "IMGBB_API_KEY=$IMGBB_API_KEY" > .env
            echo "Successfully configured .env with IMGBB_API_KEY"
          fi

      - name: Restore Debug Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Error: DEBUG_KEYSTORE_BASE64 secret is missing."
            echo "You must add the DEBUG_KEYSTORE_BASE64 secret to your GitHub repository."
            echo "1. Go to your AI Studio project, and run 'base64 -w 0 debug.keystore > debug.keystore.base64'"
            echo "2. Copy the contents of the generated debug.keystore.base64 file."
            echo "3. In GitHub, go to Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "4. Name it DEBUG_KEYSTORE_BASE64 and paste the contents."
            exit 1
          fi
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore

      - name: Restore Firebase Config
        run: cp app/google-services-public.json app/google-services.json

      - name: Set Release Version
        run: |
          MIN_VERSION_CODE=102
          RAW_VERSION_CODE=$(( ${{ github.run_number }} + 101 ))
          if [ "$RAW_VERSION_CODE" -lt "$MIN_VERSION_CODE" ]; then
            CALC_VERSION_CODE=$MIN_VERSION_CODE
          else
            CALC_VERSION_CODE=$RAW_VERSION_CODE
          fi
          CALC_VERSION_NAME="${CALC_VERSION_CODE}.0"
          echo "TAG_NAME=v${CALC_VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_NAME=${CALC_VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${CALC_VERSION_CODE}" >> $GITHUB_ENV
          echo "Calculated versionCode: ${CALC_VERSION_CODE}, versionName: ${CALC_VERSION_NAME}"

      - name: Build Debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: motor-winding-data-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: App Version ${{ env.VERSION_NAME }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true

      - name: Update Firestore App Config
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Error: FIREBASE_SERVICE_ACCOUNT secret is missing."
            exit 1
          fi
          npm install firebase-admin
          node -e "
          const { initializeApp, cert } = require('firebase-admin/app');
          const { getFirestore } = require('firebase-admin/firestore');
          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          initializeApp({
            credential: cert(serviceAccount)
          });
          const db = getFirestore();
          const latestVersionCode = parseInt(process.env.VERSION_CODE, 10);
          const latestVersionName = process.env.VERSION_NAME;
          if (!Number.isInteger(latestVersionCode) || latestVersionCode < 102) {
            throw new Error('Invalid VERSION_CODE: ' + process.env.VERSION_CODE);
          }
          const updateUrl = \`https://github.com/\${process.env.GITHUB_REPOSITORY}/releases/download/\${process.env.TAG_NAME}/app-debug.apk\`;
          db.doc('app_config/update').set({
            latestVersionCode: latestVersionCode,
            latestVersionName: latestVersionName,
            minimumSupportedVersionCode: 102,
            forceUpdate: true,
            updateMessage: 'A new version of Motor Winding Data is available. Please update the app to continue.',
            updateUrl: updateUrl
          }).then(() => {
            console.log('Successfully updated Firestore app_config/update');
            process.exit(0);
          }).catch(error => {
            console.error('Error updating Firestore:', error);
            process.exit(1);
          });
          "
